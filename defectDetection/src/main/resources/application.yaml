  # 群组ID
  group-id: 1
  # 证书路径
  cert-path: blockchain/conf
  # 私钥(Demo8的私钥)
  hex-private-key: abce280926debccedf8d7b6555b26353573e4cbfa11b4b23fc2cdca9559ddd49
