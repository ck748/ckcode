    raw-material: "0x179396f45e1cde809780a7b077c026fcb317548f"  # 原材料合约
    workshop1: "0xf11054f8bc2e4d78a0ded5aa0ead04debc9401f4"  # 车间1合约（来自qkl）
    workshop2: "0xcd3775b2ccce8f5fb108c53597b22bf81d5058d1"  # 车间2合约（来自qkl）
